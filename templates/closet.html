<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mon Armoire - Closet</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
</head>
<body>
<div class="closet-container">

    <div class="sidebar">
        <h2 class="sidebar-title">Categories</h2>
        <ul class="category-list">
            <li id="cat-top" class="active" onclick="showCategory('top')">Tops</li>
            <li id="cat-bottom" onclick="showCategory('bottom')">Pants</li>
            <li id="cat-skirt" onclick="showCategory('skirt')">Skirts</li>
            <li id="cat-dress" onclick="showCategory('dress')">Dresses</li>
        </ul>
        <div class="sidebar-footer">
            <button class="clear-btn" onclick="clearOutfit()">Clear Outfit</button>
            <a href="{{ url_for('menu') }}" class="back-circle-btn">←</a>
        </div>
    </div>

    <div class="wardrobe-main">
        <h1 id="category-heading">My Tops</h1>
        <div class="clothes-grid" id="clothes-grid">
            {% for img in images %}
            <div class="item-slot" data-type="{{ img.type }}" onclick="wearItem('{{ img.url }}', '{{ img.type }}')">
                <button class="delete-btn" onclick="deleteItem(event, '{{ img.url }}')">×</button>
                <img src="{{ img.url }}" alt="Clothing Item">
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="avatar-preview">
        <div id="changing-curtain" class="curtain-container">
            <div class="curtain-side curtain-left"></div>
            <div class="curtain-side curtain-right"></div>
        </div>

        <div id="loading-spinner" class="loading-overlay">Fitting Item...</div>
        
        <img src="{{ url_for('static', filename='images/avatar.png') }}" alt="Dummy" class="avatar-dummy">
        
        <img src="" id="clothing-layer" class="clothing-on-body">
    </div>
</div>

<script>
let currentCategory = 'top';
const jsCache = {}; 
let currentOutfit = {}; // Track what's currently worn

async function wearItem(imgUrl, type) {
    const layer = document.getElementById('clothing-layer');
    const spinner = document.getElementById('loading-spinner');
    const curtain = document.getElementById('changing-curtain');
    
    // Normalize type (treat skirts as bottom for caching)
    const normalizedType = (type === 'skirt' || type === 'skirts') ? 'bottom' : type;

    // 1. Close the curtains immediately
    curtain.classList.add('closed');

    // Small delay to allow curtain animation to finish closing
    setTimeout(async () => {
        
        // Show Fitting text while AI works
        spinner.style.display = "block";
        layer.style.display = "none"; 

        try {
            const response = await fetch('/tryon', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imgUrl, type: type })
            });

            const data = await response.json();

            if (data.success) {
                // Update current outfit tracking
                if (normalizedType === 'dress') {
                    currentOutfit = { dress: imgUrl };
                } else {
                    if (currentOutfit.dress) {
                        delete currentOutfit.dress;
                    }
                    currentOutfit[normalizedType] = imgUrl;
                }

                console.log('Current outfit:', currentOutfit);

                // Pre-load image so it doesn't "pop" in after curtains open
                const img = new Image();
                img.src = data.url;
                img.onload = () => {
                    layer.src = data.url;
                    layer.style.display = "block";
                    spinner.style.display = "none";
                    // Open curtains now that image is ready
                    setTimeout(() => {
                        curtain.classList.remove('closed');
                    }, 300);
                };
            } else {
                console.error("Try-on failed:", data.error);
                spinner.style.display = "none";
                curtain.classList.remove('closed');
            }
        } catch (error) {
            console.error("Try-on failed", error);
            spinner.style.display = "none";
            curtain.classList.remove('closed');
        }
    }, 500);
}

function showCategory(category) {
    currentCategory = category;
    
    // Update heading
    const categoryNames = {
        'top': 'Tops',
        'bottom': 'Pants',
        'skirt': 'Skirts',
        'dress': 'Dresses'
    };
    document.getElementById('category-heading').innerText = "My " + (categoryNames[category] || category);
    
    // Update active state
    document.querySelectorAll('.category-list li').forEach(li => li.classList.remove('active'));
    const activeEl = document.getElementById('cat-' + category);
    if(activeEl) activeEl.classList.add('active');

    // Filter items
    document.querySelectorAll('.item-slot').forEach(item => {
        const itemType = item.dataset.type;
        // Show if type matches, or if showing skirts and item is skirt/skirts
        const shouldShow = (itemType === category) || 
                          (category === 'skirt' && (itemType === 'skirt' || itemType === 'skirts'));
        item.style.display = shouldShow ? "flex" : "none";
    });
}

async function clearOutfit() {
    const layer = document.getElementById('clothing-layer');
    const curtain = document.getElementById('changing-curtain');
    
    // Clear client-side tracking
    currentOutfit = {};
    
    // Clear server-side tracking
    try {
        await fetch('/clear_outfit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'}
        });
    } catch (e) {
        console.error("Failed to clear server outfit:", e);
    }
    
    curtain.classList.add('closed');
    setTimeout(() => {
        layer.src = "";
        layer.style.display = "none";
        setTimeout(() => curtain.classList.remove('closed'), 400);
    }, 500);
}

async function deleteItem(event, imgUrl) {
    event.stopPropagation(); // Prevent slot click

    if(!confirm("Are you sure you want to delete this item?")) return;

    const slot = event.target.closest('.item-slot');

    try {
        const response = await fetch('/delete_item', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ image_url: imgUrl })
        });

        const data = await response.json();

        if(data.success) {
            slot.style.transition = "0.3s";
            slot.style.opacity = "0";
            slot.style.transform = "scale(0.8)";
            setTimeout(() => slot.remove(), 300);
        } else {
            alert("Delete failed: " + data.error);
        }

    } catch (e) {
        console.error("Delete failed", e);
    }
}

window.onload = () => showCategory('top');
</script>
</body>
</html>
