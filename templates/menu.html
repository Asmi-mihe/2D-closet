<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mon Armoire - Menu</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='menu.css') }}">
</head>
<body>
    <div class="menu-container">
        
        <div class="logo-wrapper">
            <img src="{{ url_for('static', filename='images/bow.png') }}" alt="Logo">
        </div>

        <div class="action-box">
            <a href="{{ url_for('closet') }}" class="pill-btn">
                <div class="icon-circle">
                    <img src="{{ url_for('static', filename='images/hanger.png') }}" alt="Hanger">
                </div>
                <span>Go to closet</span>
            </a>

            <label for="upload" class="pill-btn">
                <div class="icon-circle">
                    <img src="{{ url_for('static', filename='images/camera.png') }}" alt="Camera">
                </div>
                <span>Click/Upload</span>
            </label>
            <input type="file" id="upload" hidden>
        </div>

        <div class="character-wrapper">
            <img src="{{ url_for('static', filename='images/pixel_girl.png') }}" alt="Mascot">
        </div>

    </div>

    <script>
        // Grab the input
        const uploadInput = document.getElementById('upload');
        uploadInput.addEventListener('change', () => {
    if (!uploadInput.files.length) return alert("Please select a file!");

    const file = uploadInput.files[0];
    const formData = new FormData();
    formData.append('image', file);

    fetch('/upload', { method: 'POST', body: formData })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                // Trigger a custom event with the uploaded image info
                window.dispatchEvent(new CustomEvent('uploadedClothing', {
                    detail: { url: data.url, type: data.type }
                }));
                alert(`Upload successful! Detected type: ${data.type}`);
            } else {
                alert("Upload failed: " + (data.error || "Unknown error"));
            }
        })
        .catch(err => alert("Upload error: " + err));
});

    </script>

</body>
</html>
